<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Observatory stage stand-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e2e8f0; font-family: "DejaVu Sans", system-ui, sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  h1 { position: absolute; left: 5%; top: 6%; margin: 0; font-size: 4.2vh; letter-spacing: .02em; }
  .sub { position: absolute; left: 5%; top: 14%; font-size: 2.4vh; color: #93c5fd; }
  .node { position: absolute; top: 38%; width: 14%; height: 18%; border: 2px solid #334155; border-radius: 10px; background: #111c33;
          display: flex; align-items: center; justify-content: center; font-size: 2.2vh; text-align: center; }
  .node.hot { border-color: #38bdf8; background: #0c2a44; }
  #bar { position: absolute; left: 5%; bottom: 22%; height: 1.2vh; background: #38bdf8; border-radius: 1vh; }
  #clock { position: absolute; right: 5%; top: 6%; font-size: 3vh; font-variant-numeric: tabular-nums; color: #4ade80; }
  #banner { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.2vh 5%; background: #1e293b; font-size: 1.9vh; color: #cbd5e1; }
</style>
</head>
<body>
<div id="stage">
  <h1>GridForge Observatory</h1>
  <div class="sub">Stand-in stage for the broadcast pipeline - synthetic hall, illustrative only</div>
  <div id="clock">t = 0.000 s</div>
  <div class="node" id="n0" style="left:5%">Grid supply</div>
  <div class="node" id="n1" style="left:24%">Substation</div>
  <div class="node" id="n2" style="left:43%">Transformer</div>
  <div class="node" id="n3" style="left:62%">UPS</div>
  <div class="node" id="n4" style="left:81%">Rack rows</div>
  <div id="bar"></div>
  <div id="banner">Synthetic demonstration. No customer data. Not a capacity commitment.</div>
</div>
<script>
  // The deterministic frame contract of the real stage: ?t=<seconds>&freeze=1 renders the frame for t and stops.
  // Without freeze=1 the page runs on its own clock (real-time capture). window.__obsSeek(t) is an optional fast path.
  const params = new URLSearchParams(location.search);
  const frozen = params.get("freeze") === "1";
  const nodes = [0, 1, 2, 3, 4].map((i) => document.getElementById("n" + i));
  function draw(t) {
    document.getElementById("clock").textContent = "t = " + t.toFixed(3) + " s";
    const active = Math.floor(t / 2) % nodes.length;
    nodes.forEach((n, i) => n.classList.toggle("hot", i === active));
    document.getElementById("bar").style.width = (90 * ((t % 10) / 10)).toFixed(3) + "%";
    document.documentElement.dataset.t = t.toFixed(3);
  }
  window.__obsSeek = async (t) => { draw(t); };
  if (frozen) {
    draw(parseFloat(params.get("t") || "0"));
  } else {
    const t0 = performance.now() - parseFloat(params.get("t") || "0") * 1000;
    const loop = () => { draw((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
    loop();
  }
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>

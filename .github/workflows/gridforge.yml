name: gridforge

# The engine is what gets sold. If it cannot produce a Density Screen from the
# blank intake that `gridforge init` hands a client, nothing else matters.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency only
        run: python -m pip install --quiet pytest
      - name: Unit and architecture tests
        run: python -m pytest tests -q
      - name: The engine must import with no third-party package present
        run: python -c "import gridforge.cli, gridforge.intake.loader, gridforge.envelope"
      - name: Nothing priced may be unbuyable, ungeneratable or undeliverable
        run: python -m pytest tests/test_stack_consistency.py tests/test_catalogue_parity.py -q
      - name: One domain, one company, one price list
        run: |
          # The site carried two businesses: the behind-the-meter practice this
          # repository began as, and the density engine it became. Both were live,
          # with two fee structures on one pricing page, and every canonical URL
          # pointed at a preview domain while every email pointed at the real one.
          python -m pytest tests/test_one_company.py -q
      - name: Nothing foreign at the root, and no patch committed anywhere
        run: |
          # A patch file and a build tool from another project both reached public
          # main by being uploaded to the repository root. .gitignore is no defence:
          # a web upload commits directly, and an ignore rule only stops an
          # UNTRACKED file being staged.
          git ls-files | grep -E '\.patch$' && { echo "a patch is committed"; exit 1; } || true
          python -m pytest tests/test_stack_consistency.py -q \
            -k "repository_root or allowlist or patch_is_committed or inbox or apply_script"

  deliverables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Blank intake must survive every command
        run: |
          python -m gridforge init -o /tmp/blank.json
          python -m gridforge gaps /tmp/blank.json
          python -m gridforge screen /tmp/blank.json -o /tmp/blank_out
          python -m gridforge study  /tmp/blank.json -o /tmp/blank_out
      - name: Every shipped example must produce a screen and a study
        run: |
          for f in examples/intake/*.json; do
            python -m gridforge screen "$f" -o "/tmp/out/$(basename "$f" .json)"
            python -m gridforge study  "$f" -o "/tmp/out/$(basename "$f" .json)"
          done
      - name: Portfolio screen over every example
        run: python -m gridforge portfolio examples/intake/*.json -o /tmp/portfolio
      - name: Reference project
        run: python -m examples.reference_site
      - name: A quotation must strengthen the deliverable
        run: |
          python -m gridforge cost add --key tapoff.unit --label "tap-off unit" --unit EUR/rack \
            --value 5200 --basis firm_quote --supplier CI --quoted-on 2026-01-01 \
            --valid-until 2099-12-31 --library /tmp/costs.json
          GRIDFORGE_COST_LIBRARY=/tmp/costs.json python -m gridforge study \
            examples/intake/reference_hall.json -o /tmp/quoted
          grep -q "firm quote" /tmp/quoted/envelope_study.md
      - name: Proposal from the CLI
        run: python -m gridforge proposal examples/intake/reference_hall.json -o /tmp/proposal
      - name: A change note names the input that moved the answer
        run: |
          python -c "
          import json, copy
          d = json.load(open('examples/intake/reference_hall.json'))
          a = copy.deepcopy(d); a['grid']['contracted_MW'] = 10.5
          json.dump(a, open('/tmp/after.json','w'))
          "
          python -m gridforge diff examples/intake/reference_hall.json /tmp/after.json -o /tmp/change
          python -c "import json; c=json.load(open('/tmp/change/change.json')); assert c['racks_delta']<0; assert c['drivers'][0]['path']=='grid.contracted_MW', c['drivers']; assert c['explained_racks']+c['unexplained_racks']==c['racks_delta']; print('change note ok:', c['headline'])"
      - name: Walkthrough deck from the CLI
        run: |
          python -m gridforge deck examples/intake/reference_hall.json -o /tmp/deck
          python -c "h=open('/tmp/deck/walkthrough.html').read(); assert 'http' not in h.replace('http-equiv',''), 'the deck must render offline'; assert '<svg' in h; print('deck ok', len(h), 'bytes')"
      - name: The committed cost library must hold no quotations
        run: python -m gridforge cost where
      - name: The accuracy record must be honest, and refuse to be faked
        run: |
          python -m gridforge calibrate where
          python -m gridforge calibrate keys
          python -m gridforge calibrate show | tee /tmp/cal.txt
          grep -q "has not been established" /tmp/cal.txt
          python -m gridforge calibrate add --key envelope.racks --site "CI" --hall H1 \
            --predicted 26 --observed 24 --unit racks --on 2026-11-30 \
            --method "CI smoke" --ledger /tmp/cal.json
          python -c "
          import json
          d = json.load(open('/tmp/cal.json'))
          assert len(d['observations']) == 1
          assert 'CI' not in json.dumps(d).replace('CI smoke',''), 'a site name reached the ledger'
          print('ledger ok')
          "
          # An observation weaker than site data must be refused, or the ledger can
          # validate the engine against itself.
          if python -m gridforge calibrate add --key envelope.racks --site B --hall H2 \
               --predicted 1 --observed 1 --on 2026-01-01 --method m \
               --evidence E1_MODEL --ledger /tmp/cal.json; then
            echo "a modelled observation was accepted into the calibration ledger"; exit 1
          fi
          # And client data must be impossible to commit.
          if python -m gridforge calibrate add --key envelope.racks --site B --hall H2 \
               --predicted 1 --observed 1 --on 2026-01-01 --method m \
               --ledger gridforge/data/calibration.json; then
            echo "client site data was written into the published ledger"; exit 1
          fi
      - name: A specification is traceable, and a bid round-trips
        run: |
          python -m gridforge spec examples/intake/reference_hall.json --list
          python -m gridforge spec examples/intake/reference_hall.json \
            --constraint busway_ampacity --reference CI-01 -o /tmp/spec
          python - <<'PY'
          import json, pathlib
          t = json.load(open("/tmp/spec/response_template.json"))
          assert t["compliance"], "the template lists no mandatory requirements"
          assert t["specification"]["sized_for_racks"] > 0
          for name, capex, lead in [("Alpha", 480000, 20), ("Beta", 392000, 44)]:
              d = json.loads(json.dumps(t))
              d.update(supplier=name, received_on="2026-10-01", valid_until="2026-12-31")
              d["values"].update(capex_eur=capex, lead_time_weeks=lead, install_weeks=6)
              d["compliance"] = {k: "C" for k in d["compliance"]}
              pathlib.Path(f"/tmp/spec/{name}.json").write_text(json.dumps(d))
          PY
          python -m gridforge bids examples/intake/reference_hall.json \
            /tmp/spec/Alpha.json /tmp/spec/Beta.json \
            --constraint busway_ampacity --ingest --basis firm_quote | tee /tmp/bids.txt
          grep -q "cost add" /tmp/bids.txt
          grep -q "Review before you run it" /tmp/bids.txt
          # A specification that names a manufacturer is one we take a margin on.
          python - <<'PY'
          md = open("/tmp/spec/specification.md").read().lower()
          for brand in ("vertiv", "schneider", "eaton", "abb", "siemens", "motivair"):
              assert brand not in md, f"the specification named {brand}"
          assert "take no margin on hardware" in md
          assert "not sufficient on their own to raise a purchase order" in md
          print("specification ok")
          PY
      - name: Signed keys mint here and verify here
        env:
          GRIDFORGE_KEY_SECRET: ci-signing-secret
        run: |
          python -m gridforge key plans
          KEY=$(python -m gridforge key issue --account ci-acme --plan api_scale | head -1)
          python -m gridforge key inspect "$KEY"
          python -c "
          import os, sys
          from gridforge.api.keys import verify, KeyError_
          k = verify(sys.argv[1])
          assert k.account == 'ci-acme' and k.quota == 2500, k
          os.environ['GRIDFORGE_REVOKED_KEYS'] = k.key_id
          try:
              verify(sys.argv[1]); print('a revoked key still verified'); raise SystemExit(1)
          except KeyError_ as exc:
              assert 'revoked' in str(exc), exc
          print('signed keys ok:', k.key_id)
          " "$KEY"
      - name: Refuse to mint an unsigned key
        run: |
          if python -m gridforge key issue --account x --plan api_triage; then
            echo "a key was minted with no signing secret"; exit 1
          fi
      - name: The machine-callable surface must be printable
        run: |
          python -m gridforge tools
          python -m gridforge tools --json -o /tmp/tools.json
          python -c "
          import json
          d = json.load(open('/tmp/tools.json'))
          assert len(d['tools']) >= 6
          assert d['mcp']['endpoint'] == '/mcp'
          assert all(t['returns'] for t in d['tools'])
          print('catalogue ok:', len(d['tools']), 'tools')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sample-deliverables
          path: |
            /tmp/portfolio
            /tmp/blank_out

  reference:
    runs-on: ubuntu-latest
    # The worked example at /reference is the deliverable a prospect reads before
    # they pay. If it drifts from the engine, we are showing a promise we no
    # longer keep. Regenerate it here and fail on any byte of difference.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate the published worked example
        run: bash scripts/build-reference.sh
      - name: The committed worked example must match a fresh run
        run: |
          git diff --stat -- public/reference
          git diff --exit-code -- public/reference || {
            echo ""
            echo "public/reference is stale. Run: bash scripts/build-reference.sh && git add public/reference"
            exit 1
          }
          test -z "$(git status --porcelain -- public/reference)" || {
            git status --porcelain -- public/reference
            echo "the build produced files that are not committed"
            exit 1
          }
      - name: The working files must carry a checkable provenance chain
        run: |
          python -c "
          import csv, pathlib
          d = pathlib.Path('public/reference/working_files')
          for name in ['scenarios.csv','headroom_ladder.csv','constraints.csv','inputs.csv','assumed_inputs.csv','provenance.csv','README.txt']:
              assert (d/name).exists(), name
          rows = list(csv.DictReader(open(d/'provenance.csv')))
          assert len(rows) > 20, len(rows)
          assert all(r['digest'] for r in rows), 'a quantity with no digest'
          derived = [r for r in rows if r['derived_from']]
          assert derived, 'nothing derived — the chain is flat'
          print('provenance ok:', len(rows), 'quantities,', len(derived), 'derived')
          "
      - name: The constraint reference must cover the engine, both directions
        run: |
          python -m gridforge reference
          python -m gridforge reference platforms
          python -c "
          import json
          from gridforge.calibration.keys import CONSTRAINT_IDS
          from gridforge.reference import reference_payload, platform_payload
          r = reference_payload()
          ids = {c['id'] for c in r['constraints']}
          assert ids == set(CONSTRAINT_IDS), (
              'reference and engine disagree:',
              sorted(set(CONSTRAINT_IDS) - ids), sorted(ids - set(CONSTRAINT_IDS)))
          for c in r['constraints']:
              assert c['lead_time_weeks'], c['id']
              assert c['binds_when'].strip(), c['id']
          lib = platform_payload()
          assert lib['deliberately_absent'], 'the absences are the point'
          for p in lib['platforms']:
              assert p['sources'] or p['generic'], p['id']
          print('reference ok:', len(ids), 'constraints,', len(lib['platforms']), 'platforms')
          "
          # Published prose may not claim a track record we do not have.
          python -c "
          import json, re
          from gridforge.reference import reference_payload
          blob = json.dumps(reference_payload()).lower()
          for bad in ['proven', 'guaranteed', 'case study', 'we have achieved', 'certified']:
              assert bad not in blob, f'the public reference claims {bad!r}'
          print('language ok')
          "
      - name: Every constraint has a machine-readable twin
        run: |
          python -c "
          import json, pathlib
          ref = pathlib.Path('public/reference')
          doc = json.loads((ref / 'constraints.json').read_text())
          for c in doc['constraints']:
              f = ref / 'constraints' / (c['slug'] + '.json')
              assert f.exists(), f'no JSON twin for {c[\"slug\"]}'
              twin = json.loads(f.read_text())
              assert twin['worked_example'] == c['worked_example']
              assert twin['notice'], 'a twin that travels without the notice is a naked number'
          print('twins ok:', len(doc['constraints']))
          "
      - name: The published specification must be part of the worked example
        run: |
          test -f public/reference/specification.html
          test -f public/reference/response_template.json
          python -c "
          import json
          t = json.load(open('public/reference/response_template.json'))
          assert t['compliance'], 'no mandatory requirements in the published template'
          assert t['values'], 'no response fields in the published template'
          print('published specification ok')
          "
      - name: The published pack must declare itself synthetic
        run: |
          python -c "
          import json
          d = json.load(open('public/reference/model_pack.json'))
          assert d['synthetic'] is True
          assert 'not a customer asset' in d['notice']
          print('notice ok')
          "

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start the engine
        env:
          GRIDFORGE_API_KEYS: ci-key
        run: |
          python -m gridforge serve --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 0.5
          done
      - name: Public qualifier answers, and leaks nothing priced
        run: |
          curl -sf -X POST http://127.0.0.1:8080/v1/qualify \
            -H 'content-type: application/json' \
            -d '{"contracted_MW":12,"current_site_peak_MW":7.4,"current_it_load_MW":4.9,"busway_ampacity_A":400,"tapoff_max_A":63,"plant_supply_C":6,"positions_available":180}' \
            -o /tmp/q.json
          python -c "import json; b=json.load(open('/tmp/q.json')); s=json.dumps(b); assert b['as_found']['binding_constraint'], 'no binding constraint'; assert 'EUR' not in s, 'leaked a currency figure'; assert 'capex' not in s, 'leaked capex'; print('qualifier ok:', b['as_found']['binding_constraint'])"
      - name: Proposal renders and quotes the catalogue price
        run: |
          curl -sf -X POST http://127.0.0.1:8080/v1/proposal \
            -H 'content-type: application/json' -H 'x-api-key: ci-key' \
            -d '{"intake":{"grid":{"contracted_MW":12,"current_site_peak_MW":7.4,"current_it_load_MW":4.9},"lv":{"busway_ampacity_A":400,"tapoff_max_A":63},"thermal":{"plant":{"design_supply_C":6}},"hall":{"positions_available":180},"compute":{"platform":"gb300_nvl72"}},"engagement":"density_screen","format":"md"}' \
            -o /tmp/p.json
          python -c "import json; b=json.load(open('/tmp/p.json')); assert b['engagement']['price_eur']==4500, b['engagement']; assert 'What we already found' in b['document']; print('proposal ok')"
      - name: A change with no movement reports no movement
        run: |
          python -c "
          import json
          d = json.load(open('examples/intake/reference_hall.json'))
          json.dump({'before': d, 'after': d, 'format': 'md'}, open('/tmp/same.json','w'))
          "
          curl -sf -X POST http://127.0.0.1:8080/v1/diff \
            -H 'content-type: application/json' -H 'x-api-key: ci-key' \
            --data @/tmp/same.json -o /tmp/d.json
          python -c "import json; b=json.load(open('/tmp/d.json')); assert b['material'] is False, b['headline']; assert b['racks_delta']==0; print('no-change ok')"
      - name: Paid endpoints refuse without a key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/study -d '{}')
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
      - name: An agent can discover the surface without a key
        run: |
          curl -sf http://127.0.0.1:8080/v1/tools -o /tmp/tools.json
          curl -sf http://127.0.0.1:8080/v1/calibration -o /tmp/cal.json
          python -c "
          import json
          t = json.load(open('/tmp/tools.json'))
          assert {x['name'] for x in t['tools']} >= {'gridforge_qualify','gridforge_study'}
          c = json.load(open('/tmp/cal.json'))
          assert c['state'] == 'uncalibrated', c['state']
          assert 'has not been established' in c['statement']
          print('discovery ok')
          "
      - name: The free tier is reachable by an agent with no key at all
        run: |
          # The single best distribution channel this product has: a stranger adding
          # GridForge to their AI client and getting a real answer in thirty seconds.
          # It was closed by a transport-level gate that protected nothing.
          curl -sf -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"gridforge_qualify","arguments":{"contracted_MW":12,"current_site_peak_MW":7.4,"current_it_load_MW":4.9,"busway_ampacity_A":400,"tapoff_max_A":63,"plant_supply_C":6,"positions_available":180}}}' \
            -o /tmp/free.json
          python -c "
          import json
          r = json.load(open('/tmp/free.json'))['result']
          assert r['isError'] is False
          assert r['structuredContent']['as_found']['binding_constraint']
          blob = json.dumps(r)
          assert 'EUR' not in blob and 'capex' not in blob, 'the free tool leaked priced content'
          print('free tier ok:', r['content'][0]['text'])
          "
          # And every paid tool still refuses, with the free one named.
          curl -sf -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"gridforge_study","arguments":{}}}' \
            -o /tmp/paid.json
          python -c "
          import json
          e = json.load(open('/tmp/paid.json'))['error']
          assert e['code'] == -32001, e
          assert e['data']['free_tool'] == 'gridforge_qualify'
          print('paid tools still gated')
          "
      - name: MCP answers a handshake and a tool call
        run: |
          curl -sf -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' -H 'x-api-key: ci-key' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' -o /tmp/init.json
          curl -sf -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' -H 'x-api-key: ci-key' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"gridforge_qualify","arguments":{"contracted_MW":12,"current_site_peak_MW":7.4,"current_it_load_MW":4.9,"busway_ampacity_A":400,"tapoff_max_A":63,"plant_supply_C":6,"positions_available":180}}}' \
            -o /tmp/call.json
          python -c "
          import json
          i = json.load(open('/tmp/init.json'))['result']
          assert i['serverInfo']['name'] == 'gridforge'
          assert 'evidence class' in i['instructions'].lower()
          r = json.load(open('/tmp/call.json'))['result']
          assert r['isError'] is False
          assert r['structuredContent']['calibration']['state']
          blob = json.dumps(r)
          assert 'EUR' not in blob and 'capex' not in blob, 'the free tool leaked priced content'
          print('mcp ok:', r['content'][0]['text'])
          "
      - name: A self-serve key the engine has never seen works
        env:
          GRIDFORGE_KEY_SECRET: ci-selfserve-secret
        run: |
          # No GRIDFORGE_API_KEYS at all: every key was issued elsewhere.
          python -m gridforge serve --port 8082 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8082/health && break; sleep 0.5; done
          KEY=$(python -m gridforge key issue --account ci-selfserve --plan api_triage | head -1)
          curl -sf http://127.0.0.1:8082/v1/version -o /tmp/v.json
          python -c "
          import json; d=json.load(open('/tmp/v.json'))
          assert d['auth_configured'] is True, 'a self-serve engine reported itself unconfigured'
          assert d['signed_keys'] is True
          "
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST http://127.0.0.1:8082/v1/screen \
            -H 'content-type: application/json' -H "x-api-key: $KEY" \
            -d '{"intake":{"grid":{"contracted_MW":12},"lv":{"busway_ampacity_A":400}}}')
          test "$code" = "200" || { echo "self-serve key rejected: $code"; cat /tmp/s.json; exit 1; }
          curl -sf http://127.0.0.1:8082/v1/usage -H "x-api-key: $KEY" -o /tmp/u.json
          python -c "
          import json; u=json.load(open('/tmp/u.json'))
          assert u['account'] == 'ci-selfserve', u
          assert u['units'] == 1, u
          print('self-serve ok:', u['account'], u['units'], 'unit(s)')
          "
      - name: An exhausted quota returns 402, not 429
        env:
          GRIDFORGE_API_KEYS: tiny-key:ci:1
        run: |
          python -m gridforge serve --port 8081 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/health && break; sleep 0.5; done
          body='{"intake":{"grid":{"contracted_MW":12},"lv":{"busway_ampacity_A":400}}}'
          curl -s -o /dev/null -X POST http://127.0.0.1:8081/v1/screen \
            -H 'content-type: application/json' -H 'x-api-key: tiny-key' -d "$body"
          code=$(curl -s -o /tmp/over.json -w '%{http_code}' -X POST http://127.0.0.1:8081/v1/screen \
            -H 'content-type: application/json' -H 'x-api-key: tiny-key' -d "$body")
          test "$code" = "402" || { echo "expected 402, got $code"; cat /tmp/over.json; exit 1; }
          python -c "import json; b=json.load(open('/tmp/over.json')); assert b['fix']; print('402 ok:', b['error'])"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npm run build
      - name: A token-addressed page may not be indexed or leak
        run: |
          node -e "
          const fs = require('node:fs');
          const robots = fs.readFileSync('app/robots.ts', 'utf8');
          for (const p of ['/q/', '/deliverable/', '/watch/', '/intake/', '/api-access/']) {
            if (!robots.includes(JSON.stringify(p))) {
              console.error('not disallowed for crawlers:', p); process.exit(1);
            }
          }
          for (const f of ['app/q/[token]/page.tsx', 'app/api-access/[token]/page.tsx']) {
            if (!fs.readFileSync(f, 'utf8').includes('index: false')) {
              console.error('not noindex:', f); process.exit(1);
            }
          }
          console.log('token-addressed pages are closed');
          "
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Every purchased deliverable has a generation path
        run: |
          node -e "
          const ts = require('node:fs').readFileSync('lib/products.ts','utf8');
          const blocks = ts.split('export const PRODUCTS')[1].split('export const PRODUCT_BY_KIND')[0];
          const products = [...blocks.matchAll(/^  (\\w+): \\{([\\s\\S]*?)^  \\},/gm)];
          let bad = [];
          for (const [, id, body] of products) {
            if (!/surface:\\s*\"/.test(body)) bad.push(id + ' (no surface)');
            if (/producesDeliverable: true/.test(body) && !/endpoint:\\s*\"/.test(body))
              bad.push(id + ' (deliverable with no endpoint)');
          }
          if (bad.length) { console.error('catalogue is inconsistent:', bad); process.exit(1); }
          console.log('catalogue ok:', products.length, 'products');
          "
      - name: A key minted by the website must verify on the engine
        env:
          GRIDFORGE_KEY_SECRET: ci-cross-language-secret
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_api_keys.py -q
          # Dates relative to today. A fixture pinned to a calendar date passes
          # until the date passes, and then fails on expiry — which looks exactly
          # like the divergence this step exists to catch.
          node -e "
          const crypto = require('node:crypto');
          const iso = (d) => d.toISOString().slice(0, 10);
          const start = new Date();
          const end = new Date(start.getTime());
          end.setUTCDate(end.getUTCDate() + 35);
          const payload = {a:'ci',k:'aabbccdd',q:600,s:'machine',i:iso(start),e:iso(end)};
          const canonical = JSON.stringify(payload, Object.keys(payload).sort());
          const body = 'gfk1.' + Buffer.from(canonical).toString('base64url');
          const sig = crypto.createHmac('sha256', process.env.GRIDFORGE_KEY_SECRET)
                            .update(body).digest().toString('base64url');
          require('node:fs').writeFileSync('/tmp/node.key', body + '.' + sig);
          "
          python -c "
          from datetime import date
          from gridforge.api.keys import issue, verify
          node = open('/tmp/node.key').read().strip()
          k = verify(node)
          assert (k.account, k.quota) == ('ci', 600), k
          mine = issue('ci', quota=600, key_id='aabbccdd', issued_on=date.today(), days=35)
          assert mine == node, ('the two implementations diverged', mine, node)
          print('cross-language key agreement ok')
          "

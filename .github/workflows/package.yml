name: package

# The engine is what gets sold, so the thing that ships must be the thing that was tested. This builds the wheel and sdist, checks them,
# installs the wheel into a clean environment away from the source tree, runs a real screen with it, and proves the installed engine has
# the same code digest as the repository's. It never publishes and uses no credential.
on:
  push:
    branches: [main]
    paths: ['gridforge/**', 'pyproject.toml', 'docs/pypi-readme.md', 'scripts/check-package.py', 'tests/test_packaging.py', '.github/workflows/package.yml', '.github/workflows/publish-pypi.yml']
  pull_request:
    paths: ['gridforge/**', 'pyproject.toml', 'docs/pypi-readme.md', 'scripts/check-package.py', 'tests/test_packaging.py', '.github/workflows/package.yml', '.github/workflows/publish-pypi.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build tools
        run: python -m pip install --quiet build twine pytest
      - name: Packaging invariants
        run: python -m pytest tests/test_packaging.py -q
      - name: Build the wheel and the sdist
        run: python -m build
      - name: twine check (metadata renders on PyPI)
        run: python -m twine check --strict dist/*
      - name: Inspect the built artefacts (contents, version, entry point, nothing foreign)
        run: python scripts/check-package.py dist/
      - name: Install the wheel into a clean environment, away from the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import gridforge, pathlib
          p = pathlib.Path(gridforge.__file__).resolve()
          assert "site-packages" in p.parts, f"imported from {p}, not from the installed wheel"
          print("installed from", p)
          PY
      - name: A real screen and study from the installed engine (the bundled data files must be there)
        run: |
          cd "$RUNNER_TEMP"
          V="$RUNNER_TEMP/venv/bin"
          "$V/gridforge" init -o blank.json
          "$V/gridforge" gaps blank.json > /dev/null
          for f in "$GITHUB_WORKSPACE"/examples/intake/*.json; do
            "$V/gridforge" screen "$f" -o "out/$(basename "$f" .json)"
            "$V/gridforge" study  "$f" -o "out/$(basename "$f" .json)"
          done
          examples=$(ls "$GITHUB_WORKSPACE"/examples/intake/*.json | wc -l)
          reports=$(find out -name '*.md' -size +0 | wc -l)
          echo "$examples example halls, $reports non-empty reports"
          test "$reports" -ge $((examples * 2))
      - name: The installed engine has the repository's code digest
        run: |
          cd "$RUNNER_TEMP"
          installed=$("$RUNNER_TEMP/venv/bin/python" -c "from gridforge.provenance import code_sha256; print(code_sha256())")
          source=$(PYTHONPATH="$GITHUB_WORKSPACE" python -c "import gridforge, pathlib; assert 'site-packages' not in pathlib.Path(gridforge.__file__).parts; from gridforge.provenance import code_sha256; print(code_sha256())")
          echo "installed: $installed"
          echo "source:    $source"
          test "$installed" = "$source"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

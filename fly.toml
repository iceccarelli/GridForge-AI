# fly.toml — the capacity engine as a service.
#
#   bash scripts/deploy-engine.sh          <- does all of the below, idempotently
#
# Or by hand:
#   fly launch --no-deploy --copy-config
#   fly secrets set GRIDFORGE_API_KEYS=$(openssl rand -hex 24)
#   fly secrets set GRIDFORGE_KEY_SECRET=$(openssl rand -hex 32)
#   fly volumes create gridforge_data --size 1 --region ams
#   fly deploy
#
# Then on the website: GRIDFORGE_API_URL=https://<app>.fly.dev, GRIDFORGE_API_KEY
# for the paid endpoints, and GRIDFORGE_KEY_SECRET set to the SAME value as here —
# the site signs self-serve API keys with it and the engine verifies them offline.
#
# The engine has no database and no dependencies, so it scales to zero and starts
# in well under a second. Running it costs single-digit euros a month. The one
# piece of state it keeps is the usage meter, which is why there is a volume.
app = "gridforge-engine"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  GRIDFORGE_RATE_LIMIT = "60"
  # Comma-separated origins, or "*" while you are still wiring it up.
  GRIDFORGE_ALLOWED_ORIGINS = "*"
  # Metered usage. This path must be on the mounted volume below, or every usage
  # record is discarded on restart — and with min_machines_running = 0 that is
  # every few minutes. The engine probes the path at startup and reports the truth
  # at /v1/usage rather than claiming durability it does not have.
  GRIDFORGE_USAGE_FILE = "/data/usage.json"
  # Revoked key ids (POST /v1/revoke, operator tier). Without a writable path here the engine answers 503 to
  # a revocation and the website refuses to SELL API plans (lib/api-readiness.ts: revocation_not_persistable),
  # because a cancellation could not end the key. Same volume as the usage meter.
  #
  # TOPOLOGY: a Fly volume belongs to exactly ONE machine. Revocations (and the usage meter) are local state,
  # so this app must run exactly ONE machine (`fly scale count 1`; never add a second without shared storage).
  # A machine started without a volume reports revocation_persistable=false and the website then refuses to
  # sell API plans, but a second machine behind the load balancer would still serve keys revoked only on
  # the first -- hence the single-machine rule (a Fly volume belongs to one machine; revocation state is only coherent with one).
  GRIDFORGE_REVOKED_FILE = "/data/revoked.json"
  # The usage ledger: an append-only record of every unit charged or refunded (GET /v1/admin/ledger, operator
  # tier, feeds the invoice). Pay-as-you-go and free-allowance keys are REFUSED with a 503 when this file cannot
  # be written, because serving them unrecorded would be serving them for free; it must be on the volume above
  # and, like revocation, is only coherent while the app runs exactly ONE machine.
  GRIDFORGE_LEDGER_FILE = "/data/ledger.jsonl"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Usage survives a suspend, a restart and a deploy. Without this, nothing you bill
# from is real.
[mounts]
  source = "gridforge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

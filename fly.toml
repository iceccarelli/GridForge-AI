# fly.toml — the capacity engine as a service.
#
#   bash scripts/deploy-engine.sh          <- does all of the below, idempotently
#
# Or by hand:
#   fly launch --no-deploy --copy-config
#   fly secrets set GRIDFORGE_API_KEYS=$(openssl rand -hex 24)
#   fly secrets set GRIDFORGE_KEY_SECRET=$(openssl rand -hex 32)
#   fly volumes create gridforge_data --size 1 --region ams
#   fly deploy
#
# Then on the website: GRIDFORGE_API_URL=https://<app>.fly.dev, GRIDFORGE_API_KEY
# for the paid endpoints, and GRIDFORGE_KEY_SECRET set to the SAME value as here —
# the site signs self-serve API keys with it and the engine verifies them offline.
#
# The container starts as root only to hand the /data volume (mounted root-owned) to the unprivileged `gridforge` user, then
# drops to it before the engine starts (see the Dockerfile): the engine never runs as root.
#
# The engine has no database and no dependencies, so it scales to zero and starts
# in well under a second. Running it costs single-digit euros a month. The one
# piece of state it keeps is the usage meter, which is why there is a volume.
app = "gridforge-engine"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  GRIDFORGE_RATE_LIMIT = "60"
  # IPv6 callers are counted on TWO buckets: their /64 (the 60 above) and their enclosing /48, which allows GRIDFORGE_RATE_LIMIT_IPV6_48_MULTIPLE
  # times that (default 32, so 1,920 a minute per /48). One ordinary caller sits in one /64 and is stopped by the 60 first, never by the /48; a
  # holder of a /48 can no longer mint a fresh allowance per /64. A /48 may hold UNRELATED users (residential prefixes are often a /56 or a /60),
  # so the multiple is generous; it is a placeholder, not a measurement of any subscriber population. A /32 holder still gets one /48 allowance
  # per /48 it spreads over. IPv4 is one bucket per address as before. Nothing to set here; override only with a reason.
  # GRIDFORGE_RATE_LIMIT_IPV6_48_MULTIPLE = "32"
  # Solves in flight (any route that runs the model, /mcp tool calls included) are bounded three ways, all engine-wide and all shed rather than
  # queued: GRIDFORGE_MAX_CONCURRENT_SOLVES in all (default 16), GRIDFORGE_MAX_CONCURRENT_SOLVES_PER_CALLER for one caller identity, the same one
  # the rate limiter uses, i.e. the IPv4 address or the IPv6 /64 (default 2), and at most half of the total (at least one) for keyless callers,
  # so a keyed caller, the website included, always has headroom. 0 turns a bound off; a negative or unreadable value is the DEFAULT, never "off".
  # A request that would exceed a bound gets 503 + Retry-After: 2 and a JSON body, is not charged, and is not queued.
  # WHAT THIS DOES NOT BOUND: how long one solve takes (there is no wall-clock limit on a single solve, and solves share one interpreter, so more
  # at once means each is slower), nor memory. The numbers are placeholders for this single shared-cpu-1x / 512 MB machine, not a measured
  # capacity, and a determined caller using many addresses can still fill the keyless share and be shed itself: keyed callers stay served.
  # Nothing to set here.
  # GRIDFORGE_MAX_CONCURRENT_SOLVES = "16"
  # GRIDFORGE_MAX_CONCURRENT_SOLVES_PER_CALLER = "2"
  # Caller identity for the rate limiter: on Fly (FLY_APP_NAME is set by the platform) the engine trusts the Fly-Client-IP header and counts
  # one X-Forwarded-For hop; anywhere else a forwarding header is ignored unless GRIDFORGE_TRUSTED_PROXY_HOPS / GRIDFORGE_TRUSTED_IP_HEADER
  # say a proxy of ours wrote it. Nothing to set here.
  # GRIDFORGE_ENFORCE_SECRET_STRENGTH = "1"  # NOT set: makes `serve` refuse to start when GRIDFORGE_ADMIN_KEY or GRIDFORGE_KEY_SECRET is
  #   shorter than 24 characters (by default it only logs a WARNING). The owner sets it once the live secrets are confirmed long enough.
  # Browser origins allowed to call the KEYED API cross-origin (credentials are X-API-Key / Authorization headers, never
  # cookies, so this decides only which pages may read responses). Unset, the engine defaults to the site (these two).
  # For a preview deployment add its origin: "https://timetopower.ai,https://www.timetopower.ai,https://<preview>.vercel.app".
  # The free keyless routes (/v1/qualify, /v1/estimate, /health, /v1/version) stay readable from any origin without
  # this list (GRIDFORGE_PUBLIC_CORS=0 closes that too); MCP and every other non-browser client ignore CORS entirely.
  GRIDFORGE_ALLOWED_ORIGINS = "https://timetopower.ai,https://www.timetopower.ai"
  # Metered usage. This path must be on the mounted volume below, or every usage
  # record is discarded on restart — and with min_machines_running = 0 that is
  # every few minutes. The engine probes the path at startup and reports the truth
  # at /v1/usage rather than claiming durability it does not have.
  GRIDFORGE_USAGE_FILE = "/data/usage.json"
  # Revoked key ids (POST /v1/revoke, operator tier). Without a writable path here the engine answers 503 to
  # a revocation and the website refuses to SELL API plans (lib/api-readiness.ts: revocation_not_persistable),
  # because a cancellation could not end the key. Same volume as the usage meter.
  #
  # TOPOLOGY: a Fly volume belongs to exactly ONE machine. Revocations (and the usage meter) are local state,
  # so this app must run exactly ONE machine (`fly scale count 1`; never add a second without shared storage).
  # A machine started without a volume reports revocation_persistable=false and the website then refuses to
  # sell API plans, but a second machine behind the load balancer would still serve keys revoked only on
  # the first -- hence the single-machine rule (a Fly volume belongs to one machine; revocation state is only coherent with one).
  GRIDFORGE_REVOKED_FILE = "/data/revoked.json"
  # The usage ledger: an append-only record of every unit charged or refunded (GET /v1/admin/ledger, operator
  # tier, feeds the invoice). Pay-as-you-go and free-allowance keys are REFUSED with a 503 when this file cannot
  # be written, because serving them unrecorded would be serving them for free; it must be on the volume above
  # and, like revocation, is only coherent while the app runs exactly ONE machine.
  GRIDFORGE_LEDGER_FILE = "/data/ledger.jsonl"
  # Measured handler time per billable endpoint (GET /v1/admin/economics, operator tier). Same volume, same
  # single-machine rule. If unset it defaults to costs.json beside GRIDFORGE_USAGE_FILE.
  GRIDFORGE_COST_FILE = "/data/costs.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Usage survives a suspend, a restart and a deploy. Without this, nothing you bill
# from is real.
[mounts]
  source = "gridforge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
